AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sanctus TV competition stream-health evidence API
Resources:
  HealthTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: channel_id
          AttributeType: S
        - AttributeName: event_ts
          AttributeType: S
      KeySchema:
        - AttributeName: channel_id
          KeyType: HASH
        - AttributeName: event_ts
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  HealthApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - https://sanctus-tv.pages.dev
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: health_api.handler
      CodeUri: lambda/
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          HEALTH_TABLE: !Ref HealthTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HealthTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HealthApi
            Path: /{proxy+}
            Method: ANY
Outputs:
  ApiUrl:
    Value: !Sub 'https://${HealthApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  TableName:
    Value: !Ref HealthTable
